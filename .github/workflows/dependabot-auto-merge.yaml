name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# Dependabot PRs run the workflow file from the PR, so a github-actions update runs the
# proposed (unreviewed) version of fetch-metadata. It runs in its own job without
# RELEASE_TOKEN; the job that holds the token runs only the preinstalled gh CLI and
# never checks out or runs code from the PR.
jobs:
  metadata:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # RELEASE_TOKEN (a PAT stored as a Dependabot secret) is used instead of GITHUB_TOKEN
  # so the resulting merge to main triggers the release workflow.
  # Only @actual-app/api merges on its own; every other update waits for a review.
  auto-merge:
    needs: metadata
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      needs.metadata.outputs.dependency-names == '@actual-app/api'
    permissions: {}
    steps:
      - name: Approve and enable auto-merge
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
