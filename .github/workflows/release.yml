name: Release

on:
  push:
    branches: [main]
    paths: [package-lock.json, Dockerfile, index.js, index-cron.js, "src/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      api-version: ${{ steps.check.outputs.api-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Release when anything that goes into the image changed: code, Dockerfile or runtime
      # dependencies. Dev-only dependency updates don't need a new image.
      - name: Check whether the image contents changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=$BEFORE
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD^
          api='.packages["node_modules/@actual-app/api"].version'
          runtime='.packages | with_entries(select(.key != "" and .value.dev != true))'
          echo "api-version=$(jq -r "$api" package-lock.json)" >> "$GITHUB_OUTPUT"

          changed=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            changed=true
          elif ! git diff --quiet "$base" HEAD -- Dockerfile index.js index-cron.js src; then
            echo "Code or Dockerfile changed"
            changed=true
          elif [ "$(git show "$base:package-lock.json" | jq -S "$runtime")" != "$(jq -S "$runtime" package-lock.json)" ]; then
            echo "Runtime dependencies changed"
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next patch tag
        id: tag
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "tag=v${major:-1}.${minor:-0}.$(( ${patch:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Create release
        run: >-
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          --notes "Built with @actual-app/api $API_VERSION."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          API_VERSION: ${{ needs.detect.outputs.api-version }}

  docker:
    needs: release
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      attestations: write
      id-token: write
