name: Release

on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json, Dockerfile, index.js, index-cron.js, "src/**"]
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes to main would otherwise compute the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      api-version: ${{ steps.check.outputs.api-version }}
    steps:
      # Full history and tags, to find the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Release when anything that goes into the image changed since the last release: code,
      # Dockerfile, package.json or runtime dependencies. Diffing against the last v* tag (not the
      # previous push) means changes from a cancelled or failed run are picked up by the next one.
      # Dev-only dependency updates and lockfile metadata (e.g. hasInstallScript) don't count.
      - name: Check whether the image contents changed
        id: check
        run: |
          api='.packages["node_modules/@actual-app/api"].version'
          runtime='.packages | with_entries(select(.key != "" and .value.dev != true) | .value |= {version, resolved, integrity})'
          echo "api-version=$(jq -r "$api" package-lock.json)" >> "$GITHUB_OUTPUT"

          changed=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            changed=true
          elif ! base=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null); then
            echo "No previous release"
            changed=true
          elif ! git diff --quiet "$base" HEAD -- Dockerfile package.json index.js index-cron.js src; then
            echo "Code, Dockerfile or package.json changed since $base"
            changed=true
          elif [ "$(git show "$base:package-lock.json" | jq -S "$runtime")" != "$(jq -S "$runtime" package-lock.json)" ]; then
            echo "Runtime dependencies changed since $base"
            changed=true
          else
            echo "Nothing in the image changed since $base"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  ci:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [detect, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next patch tag
        id: tag
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "tag=v${major:-1}.${minor:-0}.$(( ${patch:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN can't create a tag on a commit whose workflow files differ from main's (it
      # has no `workflows` permission), and the API answers with a bare 403. That happens when a
      # workflow change lands on main while CI runs. Say so instead; the next release, or a
      # manual run of this workflow, ships these changes.
      - name: Check main's workflows match the release commit
        run: |
          git fetch --quiet origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows; then
            echo "::error::main changed .github/workflows since $GITHUB_SHA, so GITHUB_TOKEN can't tag it. Run the Release workflow manually from main."
            exit 1
          fi

      - name: Create release
        run: >-
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          --notes "Built with @actual-app/api $API_VERSION."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          API_VERSION: ${{ needs.detect.outputs.api-version }}

  docker:
    needs: release
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      attestations: write
      id-token: write
