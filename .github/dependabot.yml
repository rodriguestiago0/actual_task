version: 2
updates:
  # No cooldown: take new releases on the next run instead of waiting Dependabot's default 3 days.
  # @actual-app/api gets its own PR (it triggers a release); everything else is grouped.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    groups:
      npm-dependencies:
        patterns: ["*"]
        exclude-patterns: ["@actual-app/api"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 0
    # Node majors are bumped by hand: arm/v7 has to stay on the newest major with 32-bit ARM images.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 0
    groups:
      github-actions:
        patterns: ["*"]
